<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Curso Superior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12181f;
    --panel: #1b2430;
    --ink: #eef1f5;
    --ink-dim: #94a3b3;
    --accent: #ffb454;
    --bad: #ff6b6b;
    --ok: #6fd68e;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Sora', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 32px 28px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--ink-dim);
    font-size: 13.5px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-dim);
    margin: 14px 0 6px;
  }
  input {
    width: 100%;
    background: #10161d;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--ink);
    font-family: 'Sora', sans-serif;
    font-size: 14.5px;
  }
  input:focus { outline: none; border-color: var(--accent); }

  .btn {
    width: 100%;
    margin-top: 20px;
    padding: 11px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #241a06;
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .toggle {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .toggle a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .toggle a:hover { text-decoration: underline; }

  .msg {
    margin-top: 14px;
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 8px;
    display: none;
  }
  .msg.error { display: block; background: rgba(255,107,107,0.12); color: var(--bad); }
  .msg.ok { display: block; background: rgba(111,214,142,0.12); color: var(--ok); }

  .session-box {
    text-align: center;
  }
  .session-box p { font-size: 14.5px; }
  .session-box b { color: var(--accent); }
</style>
</head>
<body>

<div class="card">

  <div id="authView">
    <h1 id="formTitle">Inicia sesión</h1>
    <p class="sub" id="formSub">Entra con tu correo y contraseña para guardar tu avance.</p>

    <form id="authForm">
      <label for="email">Correo</label>
      <input type="email" id="email" required autocomplete="email" placeholder="tucorreo@ejemplo.com">

      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password" minlength="6" placeholder="mínimo 6 caracteres">

      <button type="submit" class="btn" id="submitBtn">Iniciar sesión</button>
    </form>

    <div class="toggle">
      <span id="toggleText">¿No tienes cuenta?</span>
      <a id="toggleLink">Regístrate</a>
    </div>

    <div class="msg" id="msgBox"></div>
  </div>

  <div class="session-box" id="sessionView" style="display:none;">
    <h1>¡Ya tienes sesión!</h1>
    <p>Conectado como <b id="sessionEmail"></b></p>
    <button class="btn" id="logoutBtn">Cerrar sesión</button>
    <div class="toggle" style="margin-top:18px;">
      <a href="index.html">Ir a los ejercicios →</a>
    </div>
  </div>

</div>

<script type="module">
  import { registrarAlumno, iniciarSesion, cerrarSesion, observarSesion }
    from "./firebase-config.js";

  let modo = "login"; // "login" | "registro"

  const formTitle   = document.getElementById('formTitle');
  const formSub     = document.getElementById('formSub');
  const submitBtn   = document.getElementById('submitBtn');
  const toggleText  = document.getElementById('toggleText');
  const toggleLink  = document.getElementById('toggleLink');
  const msgBox      = document.getElementById('msgBox');
  const authForm    = document.getElementById('authForm');
  const authView    = document.getElementById('authView');
  const sessionView = document.getElementById('sessionView');
  const sessionEmail = document.getElementById('sessionEmail');

  function setModo(nuevo) {
    modo = nuevo;
    msgBox.className = 'msg';
    if (modo === 'login') {
      formTitle.textContent = 'Inicia sesión';
      formSub.textContent = 'Entra con tu correo y contraseña para guardar tu avance.';
      submitBtn.textContent = 'Iniciar sesión';
      toggleText.textContent = '¿No tienes cuenta?';
      toggleLink.textContent = 'Regístrate';
    } else {
      formTitle.textContent = 'Crea tu cuenta';
      formSub.textContent = 'Regístrate para empezar a guardar tus resultados.';
      submitBtn.textContent = 'Registrarme';
      toggleText.textContent = '¿Ya tienes cuenta?';
      toggleLink.textContent = 'Inicia sesión';
    }
  }

  toggleLink.addEventListener('click', () => setModo(modo === 'login' ? 'registro' : 'login'));

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    msgBox.className = 'msg';

    try {
      if (modo === 'login') {
        await iniciarSesion(email, password);
      } else {
        await registrarAlumno(email, password);
      }
      // onAuthStateChanged se encarga de actualizar la vista
    } catch (err) {
      msgBox.textContent = traducirError(err.code);
      msgBox.className = 'msg error';
      submitBtn.disabled = false;
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await cerrarSesion();
  });

  observarSesion((user) => {
    submitBtn.disabled = false;
    if (user) {
      authView.style.display = 'none';
      sessionView.style.display = 'block';
      sessionEmail.textContent = user.email;
    } else {
      authView.style.display = 'block';
      sessionView.style.display = 'none';
    }
  });

  function traducirError(code) {
    const errores = {
      'auth/email-already-in-use': 'Ese correo ya tiene una cuenta. Intenta iniciar sesión.',
      'auth/invalid-email': 'El correo no es válido.',
      'auth/weak-password': 'La contraseña debe tener al menos 6 caracteres.',
      'auth/user-not-found': 'No existe una cuenta con ese correo.',
      'auth/wrong-password': 'Contraseña incorrecta.',
      'auth/invalid-credential': 'Correo o contraseña incorrectos.',
      'auth/too-many-requests': 'Demasiados intentos. Espera un momento e intenta de nuevo.'
    };
    return errores[code] || 'Ocurrió un error. Intenta de nuevo.';
  }

  setModo('login');
</script>

</body>
</html>
