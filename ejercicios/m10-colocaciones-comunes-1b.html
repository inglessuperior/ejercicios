<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colocaciones comunes - 1b</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="../assets/css/style-ejercicios.css">
</head>
<body>
<header class="max-w-4xl mx-auto text-center">
    <img src="../assets/img/logo.png" class="imagen1" alt="Logo de Inglés Superior" style="display: block; margin: 1rem auto;">
    <p class="formula mx-auto p-0" style="width: 30%">MÓDULO: 10</p>
    <h1 class="titulo1 mt-2 mb-8">Colocaciones comunes</h1>
</header>
<main class="max-w-4xl mx-auto">
    <section class="mb-6">
        <div class="text-container">
            <h2 class="titulo2 mb-4">Choose the correct option</h2>
            <p class="text-slate-600">Select the correct option to complete each sentence.</p>
        </div>
    </section>
    <section id="results-section" class="hidden my-12">
        <div id="results-card" class="text-container text-center border-0 shadow-lg bg-white space-y-3">
            <div id="score-emoji" class="text-4xl">🚀</div>
            <h2 class="titulo2 text-slate-800">Test completed!</h2>
            <p id="score-text-container" class="text-xl font-bold text-slate-800">Correct answers: <span id="score-text">0/10</span></p>
            <p id="score-percentage-container" class="text-xl font-bold text-slate-800">Your score is <span id="score-percentage">0%</span></p>
        </div>
    </section>
    <section class="mb-6">
        <div class="text-container">
            <form id="quiz-form">
                <div id="questions-container"></div>
                <div class="check-btn-container mt-10 text-center">
                    <button type="button" onclick="checkAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200">Check Answers</button>
                    <button type="button" onclick="resetQuiz()" class="ml-4 bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg shadow transition duration-200">Reset</button>
                </div>
            </form>
        </div>
    </section>
</main>
<script>
const data = [
    {
        textBefore: "We couldn't go out because there was ",
        textAfter: " rain.",
        options: ["strong", "dense", "heavy"],
        correct: "heavy",
        explanation: "We use 'heavy rain' to describe severe or intense rain."
    },
    {
        textBefore: "I usually drink ",
        textAfter: " coffee in the morning to wake up.",
        options: ["strong", "heavy", "intense"],
        correct: "strong",
        explanation: "The correct collocation for concentrated coffee is 'strong coffee'."
    },
    {
        textBefore: "She apologized because she made a ",
        textAfter: " mistake on the report.",
        options: ["heavy", "big", "strong"],
        correct: "big",
        explanation: "We say 'a big mistake' or 'a huge mistake'."
    },
    {
        textBefore: "Mark faced ",
        textAfter: " traffic on his way to the office.",
        options: ["heavy", "dense", "thick"],
        correct: "heavy",
        explanation: "'Heavy traffic' is the collocation to use when talking about slow-moving vehicles or when there are a lot of them on the road."
    },
    {
        textBefore: "Please pay ",
        textAfter: " attention to the instructions.",
        options: ["deep", "close", "strong"],
        correct: "close",
        explanation: "The standard collocation for listening or looking carefully is to 'pay close attention'."
    },
    {
        textBefore: "The company achieved ",
        textAfter: " success with its new product.",
        options: ["great", "heavy", "strong"],
        correct: "great",
        explanation: "We use 'great success' to communicate a high level of achievement or positive outcome."
    },
    {
        textBefore: "I always take a ",
        textAfter: " breath before speaking in public.",
        options: ["wide", "heavy", "deep"],
        correct: "deep",
        explanation: "To inhale a large amount of air into the lungs is to take a 'deep breath'."
    },
    {
        textBefore: "She has a ",
        textAfter: " schedule this week with many meetings.",
        options: ["heavy", "big", "busy"],
        correct: "busy",
        explanation: "'Busy schedule' is the most natural and common collocation for someone with many commitments."
    },
    {
        textBefore: "The victim gave a ",
        textAfter: " description of the vehicle to the police.",
        options: ["detailed", "strong", "long"],
        correct: "detailed",
        explanation: "We use 'detailed description' when referring to a description with many specific elements."
    },
    {
        textBefore: "We need to find a ",
        textAfter: " solution to this problem today, we don't have much time.",
        options: ["strong", "quick", "heavy"],
        correct: "quick",
        explanation: "The standard collocation for something resolved quickly is a 'quick solution'."
    }
];
</script>
<script src="../assets/js/multiple-choice.js"></script>
</body>
</html>
