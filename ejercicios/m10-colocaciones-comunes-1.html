<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colocaciones comunes - 1</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="../assets/css/style-ejercicios.css">
</head>
<body>
<header class="max-w-4xl mx-auto text-center">
    <img src="../assets/img/logo.png" class="imagen1" alt="Logo de Inglés Superior" style="display: block; margin: 1rem auto;">
    <p class="formula mx-auto p-0" style="width: 30%">MÓDULO: 10</p>
    <h1 class="titulo1 mt-2 mb-8">Colocaciones comunes</h1>
</header>
<main class="max-w-4xl mx-auto">
    <section class="mb-6">
        <div class="text-container">
            <h2 class="titulo2 mb-4">Choose the correct option</h2>
            <p class="text-slate-600">Select the correct option to complete each sentence.</p>
        </div>
    </section>
    <section id="results-section" class="hidden my-12">
        <div id="results-card" class="text-container text-center border-0 shadow-lg bg-white space-y-3">
            <div id="score-emoji" class="text-4xl">🚀</div>
            <h2 class="titulo2 text-slate-800">Test completed!</h2>
            <p id="score-text-container" class="text-xl font-bold text-slate-800">Correct answers: <span id="score-text">0/10</span></p>
            <p id="score-percentage-container" class="text-xl font-bold text-slate-800">Your score is <span id="score-percentage">0%</span></p>
        </div>
    </section>
    <section class="mb-6">
        <div class="text-container">
            <form id="quiz-form">
                <div id="questions-container"></div>
                <div class="check-btn-container mt-10 text-center">
                    <button type="button" onclick="checkAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200">Check Answers</button>
                    <button type="button" onclick="resetQuiz()" class="ml-4 bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg shadow transition duration-200">Reset</button>
                </div>
            </form>
        </div>
    </section>
</main>
<script>
const data = [
    {
        textBefore: "It is important to ",
        textAfter: " a decision before the deadline.",
        options: ["make", "do", "take"],
        correct: "make",
        explanation: "'Make a decision' is the common collocation. 'Do' is typically used for actions or tasks."
    },
    {
        textBefore: "I need to ",
        textAfter: " a phone call to my manager.",
        options: ["make", "give", "do"],
        correct: "make",
        explanation: "The standard collocation is 'make a phone call'. However, we can also say 'give someone a call' (e.g., 'I need to give my manager a call')."
    },
    {
        textBefore: "Please ",
        textAfter: " your homework before you go out.",
        options: ["make", "work", "do"],
        correct: "do",
        explanation: "We use the verb 'do' for household chores, homework, and general work tasks."
    },
    {
        textBefore: "She is trying to ",
        textAfter: " progress on her thesis project.",
        options: ["make", "get", "have"],
        correct: "make",
        explanation: "'Make progress' is the correct collocation, you can't use 'get' or 'have' here."
    },
    {
        textBefore: "Don't forget to ",
        textAfter: " the dishes after dinner.",
        options: ["wash", "do", "make"],
        correct: "do",
        explanation: "'Do the dishes' is the most common collocation for washing plates and utensils."
    },
    {
        textBefore: "Unfortunately, you ",
        textAfter: " a mistake during the planning phase.",
        options: ["did", "took", "made"],
        correct: "made",
        explanation: "We always 'make a mistake'. Avoid the common error of using 'do' here."
    },
    {
        textBefore: "I need to ",
        textAfter: " a break, I've been working for hours.",
        options: ["have", "take", "make"],
        correct: "take",
        explanation: "'Take a break' is the standard collocation for pausing work."
    },
    {
        textBefore: "Can you ",
        textAfter: " me a favor and open the window?",
        options: ["do", "make", "give"],
        correct: "do",
        explanation: "The expression is 'do someone a favor'. 'Make' is not used here."
    },
    {
        textBefore: "She likes to ",
        textAfter: " a shower right after she wakes up.",
        options: ["make", "get", "take"],
        correct: "take",
        explanation: "We say 'take a shower'. 'Get a shower' is not correct in this context."
    },
    {
        textBefore: "It's difficult to ",
        textAfter: " business with a disorganized company.",
        options: ["do", "make", "work"],
        correct: "do",
        explanation: "'Do business' is the standard collocation when talking about commercial transactions or professional relationships."
    }
];
</script>
<script src="../assets/js/multiple-choice.js"></script>
</body>
</html>
