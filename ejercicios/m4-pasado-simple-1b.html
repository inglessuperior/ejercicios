<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasado simple - 1b</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="../assets/css/style-ejercicios.css">
</head>
<body>
<header class="max-w-4xl mx-auto text-center">
<img src="../assets/img/logo.png" class="imagen1" alt="Logo de Inglés Superior" style="display: block; margin: 1rem auto;">

    <p class="formula mx-auto p-0" style="width: 30%">MÓDULO: 4</p>
    <h1 class="titulo1 mt-2 mb-8">Pasado simple</h1>
</header>
<main class="max-w-4xl mx-auto">
    <section class="mb-6">
        <div class="text-container">
            <h2 class="titulo2 mb-4">Choose the correct option</h2>
            <p class="text-slate-600">Select the correct option to complete each sentence.</p>
        </div>
    </section>
    <section id="results-section" class="hidden my-12">
        <div id="results-card" class="text-container text-center border-0 shadow-lg bg-white space-y-3">
            <div id="score-emoji" class="text-4xl">🚀</div>
            <h2 class="titulo2 text-slate-800">Test completed!</h2>
            <p id="score-text-container" class="text-xl font-bold text-slate-800">Correct answers: <span id="score-text">0/10</span></p>
            <p id="score-percentage-container" class="text-xl font-bold text-slate-800">Your score is <span id="score-percentage">0%</span></p>
        </div>
    </section>
    <section class="mb-6">
        <div class="text-container">
            <form id="quiz-form">
                <div id="questions-container"></div>
                <div class="check-btn-container mt-10 text-center">
                    <button type="button" onclick="checkAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200">Check Answers</button>
                    <button type="button" onclick="resetQuiz()" class="ml-4 bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg shadow transition duration-200">Reset</button>
                </div>
            </form>
        </div>
    </section>
</main>
<script>
const data = [
    {
        textBefore: "Amanda ",
        textAfter: " her homework before 7 PM.",
        options: ["finish", "finished", "finnished"],
        correct: "finished",
        explanation: "For regular verbs in simple past, add -ed to the base form of the verb (finish → finished)."
    },
    {
        textBefore: "",
        textAfter: " you have breakfast this morning?",
        options: ["Did", "Were", "Do"],
        correct: "Did",
        explanation: "Questions about past actions require the auxiliary verb 'did' before the subject."
    },
    {
        textBefore: "Bruno ",
        textAfter: " the restaurant bill.",
        options: ["paid", "payed", "paied"],
        correct: "paid",
        explanation: "'Pay' is an irregular verb. Its simple past form is 'paid'."
    },
    {
        textBefore: "I ",
        textAfter: " a nice weekend.",
        options: ["have", "had", "haved"],
        correct: "had",
        explanation: "'Have' is an irregular verb. Its simple past form is 'had'."
    },
    {
        textBefore: "Jim's son ",
        textAfter: " my window. It was someone else.",
        options: ["didn't broke", "didn't break", "didn't broken"],
        correct: "didn't break",
        explanation: "In negative simple past sentences, use the auxiliary 'didn't' followed by the verb in its base form (didn't break)."
    },
    {
        textBefore: "I can't breathe, I ",
        textAfter: " too much pizza.",
        options: ["ate", "eated", "eaten"],
        correct: "ate",
        explanation: "'Eat' is an irregular verb. Its simple past form is 'ate'."
    },
    {
        textBefore: "",
        textAfter: " Martha? She left a minute ago.",
        options: ["Did you see", "Did you saw", "Did see you"],
        correct: "Did you see",
        explanation: "Questions about action verbs in past tense begin with the auxiliary 'did' and use the verb in base form."
    },
    {
        textBefore: "A nice man ",
        textAfter: " me candy.",
        options: ["gave", "gived", "given"],
        correct: "gave",
        explanation: "'Give' is an irregular verb. Its simple past form is 'gave'."
    },
    {
        textBefore: "Tom and Claudia ",
        textAfter: " at the park.",
        options: ["didn't go", "wasn't", "weren't"],
        correct: "weren't",
        explanation: "The verb 'to be' forms negatives in the past with 'wasn't' or 'weren't'. For plural subjects (Tom and Claudia = they), use 'weren't'."
    },
    {
        textBefore: "Jimi Hendrix ",
        textAfter: " to play the guitar at 15.",
        options: ["learnt", "learnned", "learned"],
        correct: "learned",
        explanation: "For regular verbs in simple past, add -ed to the base form of the verb (learn → learned)."
    }
];
</script>
<script src="../assets/js/multiple-choice.js"></script>
</body>
</html>
