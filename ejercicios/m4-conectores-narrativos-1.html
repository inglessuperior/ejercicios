<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectores narrativos - 1</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="../assets/css/style-ejercicios.css">
</head>
<body>
<header class="max-w-4xl mx-auto text-center">
    <img src="../assets/img/logo.png" class="imagen1" alt="Logo de Inglés Superior" style="display: block; margin: 1rem auto;">

    <p class="formula mx-auto p-0" style="width: 30%">MÓDULO: 4</p>
    <h1 class="titulo1 mt-2 mb-8">Conectores narrativos</h1>
</header>
<main class="max-w-4xl mx-auto">
    <section class="mb-6">
        <div class="text-container">
            <h2 class="titulo2 mb-4">Choose the correct option</h2>
            <p class="text-slate-600">Select the correct option to complete each sentence.</p>
        </div>
    </section>
    <section id="results-section" class="hidden my-12">
        <div id="results-card" class="text-container text-center border-0 shadow-lg bg-white space-y-3">
            <div id="score-emoji" class="text-4xl">🚀</div>
            <h2 class="titulo2 text-slate-800">Test completed!</h2>
            <p id="score-text-container" class="text-xl font-bold text-slate-800">Correct answers: <span id="score-text">0/10</span></p>
            <p id="score-percentage-container" class="text-xl font-bold text-slate-800">Your score is <span id="score-percentage">0%</span></p>
        </div>
    </section>
    <section class="mb-6">
        <div class="text-container">
            <form id="quiz-form">
                <div id="questions-container"></div>
                <div class="check-btn-container mt-10 text-center">
                    <button type="button" onclick="checkAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200">Check Answers</button>
                    <button type="button" onclick="resetQuiz()" class="ml-4 bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg shadow transition duration-200">Reset</button>
                </div>
            </form>
        </div>
    </section>
</main>
<script>
const data = [
    {
        textBefore: "I woke up early this morning, ",
        textAfter: " I prepared a delicious breakfast.",
        options: ["because", "but", "so"],
        correct: "so",
        explanation: "Use 'so' to show the result or consequence of an action."
    },
    {
        textBefore: "She got the highest grade in the class ",
        textAfter: " she studied very hard for the history exam.",
        options: ["because", "so", "but"],
        correct: "because",
        explanation: "Use 'because' to introduce the reason or cause for something."
    },
    {
        textBefore: "We went to the supermarket to buy groceries, ",
        textAfter: " we forgot to buy milk.",
        options: ["so", "then", "but"],
        correct: "but",
        explanation: "Use 'but' to connect contrasting or opposite ideas (going shopping, but missing the milk)."
    },
    {
        textBefore: "Roy washed his hands, ",
        textAfter: " he sat down at the dinner table.",
        options: ["because", "then", "but"],
        correct: "then",
        explanation: "Use 'then' to show the sequence of events in order."
    },
    {
        textBefore: "She locked the front door, ",
        textAfter: " she walked to the bus stop.",
        options: ["or", "after that", "because"],
        correct: "after that",
        explanation: "'After that' is a transition phrase used to show that one action happened after another."
    },
    {
        textBefore: "Would you like to drink tea ",
        textAfter: " coffee with your dessert?",
        options: ["or", "and", "but"],
        correct: "or",
        explanation: "Use 'or' to present a choice between two options."
    },
    {
        textBefore: "My brother plays the guitar very well, and he ",
        textAfter: " sings in a local band.",
        options: ["finally", "because", "also"],
        correct: "also",
        explanation: "Use 'also' to add extra information or an additional action about the subject."
    },
    {
        textBefore: "Jessica and Clara went on a walk, ",
        textAfter: " they saw a cute puppy.",
        options: ["so", "and", "or"],
        correct: "and",
        explanation: "Use 'and' to connect similar ideas or sequential events."
    },
    {
        textBefore: "First, we rented a nice hotel room, ",
        textAfter: " we went to explore the city center.",
        options: ["because", "but", "next"],
        correct: "next",
        explanation: "'Next' is used to talk about the next step in a sequence of events."
    },
    {
        textBefore: "The weather was cold and rainy, ",
        textAfter: " we decided to stay home and watch a movie.",
        options: ["so", "also", "because"],
        correct: "so",
        explanation: "Use 'so' to express the outcome or decision resulting from a situation."
    }
];
</script>
<script src="../assets/js/multiple-choice.js"></script>
</body>
</html>
