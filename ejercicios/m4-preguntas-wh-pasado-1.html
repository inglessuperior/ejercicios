<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas wh- en pasado - 1</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="../assets/css/style-ejercicios.css">
</head>
<body>
<header class="max-w-4xl mx-auto text-center">
    <img src="../assets/img/logo.png" class="imagen1" alt="Logo de Inglés Superior" style="display: block; margin: 1rem auto;">
    <p class="formula mx-auto p-0" style="width: 30%">MÓDULO: 4</p>
    <h1 class="titulo1 mt-2 mb-8">Preguntas wh- en pasado</h1>
</header>
<main class="max-w-4xl mx-auto">
    <section class="mb-6">
        <div class="text-container">
            <h2 class="titulo2 mb-4">Choose the correct option</h2>
            <p class="text-slate-600">Select the correct option to complete each sentence.</p>
        </div>
    </section>
    <section id="results-section" class="hidden my-12">
        <div id="results-card" class="text-container text-center border-0 shadow-lg bg-white space-y-3">
            <div id="score-emoji" class="text-4xl">🚀</div>
            <h2 class="titulo2 text-slate-800">Test completed!</h2>
            <p id="score-text-container" class="text-xl font-bold text-slate-800">Correct answers: <span id="score-text">0/10</span></p>
            <p id="score-percentage-container" class="text-xl font-bold text-slate-800">Your score is <span id="score-percentage">0%</span></p>
        </div>
    </section>
    <section class="mb-6">
        <div class="text-container">
            <form id="quiz-form">
                <div id="questions-container"></div>
                <div class="check-btn-container mt-10 text-center">
                    <button type="button" onclick="checkAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200">Check Answers</button>
                    <button type="button" onclick="resetQuiz()" class="ml-4 bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg shadow transition duration-200">Reset</button>
                </div>
            </form>
        </div>
    </section>
</main>
<script>
const data = [
    {
        textBefore: "Where ",
        textAfter: " you go for your last summer vacation?",
        options: ["did", "do", "were"],
        correct: "did",
        explanation: "To form Wh- questions in simple past with action verbs, use the auxiliary 'did' before the subject."
    },
    {
        textBefore: "",
        textAfter: " did you feel after the exam? I felt relieved.",
        options: ["How", "Why", "When"],
        correct: "How",
        explanation: "We are asking about a feeling or state, so we use 'How'."
    },
    {
        textBefore: "Why ",
        textAfter: " he laugh during the phone call?",
        options: ["was", "were", "did"],
        correct: "did",
        explanation: "We use 'did' for all subjects in past simple Wh- questions when there is a main verb."
    },
    {
        textBefore: "",
        textAfter: " did you go on your last vacation? To Italy.",
        options: ["Where", "When", "Who"],
        correct: "Where",
        explanation: "The answer 'To Italy' shows a place, so we use 'Where'."
    },
    {
        textBefore: "What ",
        textAfter: " they eat for breakfast at the restaurant?",
        options: ["was", "did", "were"],
        correct: "did",
        explanation: "Use 'did' + subject + verb in base form to ask about past actions."
    },
    {
        textBefore: "",
        textAfter: " did you see at the party? I saw my best friend.",
        options: ["Where", "Who", "How"],
        correct: "Who",
        explanation: "The answer mentions a person ('my best friend'), so the question is 'who'."
    },
    {
        textBefore: "How ",
        textAfter: " he get to work without his car?",
        options: ["did", "does", "was"],
        correct: "did",
        explanation: "We use 'did' for all subjects in past simple Wh- questions when there is a main verb."
    },
    {
        textBefore: "Who ",
        textAfter: " you see at the concert last night?",
        options: ["was", "were", "did"],
        correct: "did",
        explanation: "We use 'did' for all subjects in past simple Wh- questions when there is a main verb."
    },
    {
        textBefore: "",
        textAfter: " did she cry at the movies? Because the movie was very sad.",
        options: ["How", "What", "Why"],
        correct: "Why",
        explanation: "The answer starts with 'Because', which means we are asking for a reason ('Why')."
    },
    {
        textBefore: "",
        textAfter: " did you arrive home? At 9:00 PM.",
        options: ["What time", "Where", "Why"],
        correct: "What time",
        explanation: "The answer gives a specific time of day, so we use 'what time' or 'at what time'."
    }
];
</script>
<script src="../assets/js/multiple-choice.js"></script>
</body>
</html>
