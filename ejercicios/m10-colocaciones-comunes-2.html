<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colocaciones comunes - 2</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="../assets/css/style-ejercicios.css">
</head>
<body>

<header class="max-w-4xl mx-auto text-center">
    <img src="../assets/img/logo.png" class="imagen1" alt="Logo de Inglés Superior" style="display: block; margin: 1rem auto;">
    <p class="formula mx-auto p-0" style="width: 30%">MÓDULO: 10</p>
    <h1 class="titulo1 mt-2 mb-8">Colocaciones comunes</h1>
</header>

<main class="max-w-4xl mx-auto">

    <!-- Cuadro independiente para Instrucciones -->
    <section class="mb-6">
        <div class="text-container">
            <h2 class="titulo2 mb-4">Drag and drop</h2>
            <p class="text-slate-600">Drag the correct words from the word bank and drop them to complete each sentence.</p>
        </div>
    </section>

    <!-- Contenedor para el resultado superior -->
    <section id="results-section" class="hidden my-12">
        <div id="results-card" class="text-container text-center border-0 shadow-lg bg-white space-y-3">
            <div id="score-emoji" class="text-4xl">🚀</div>
            <h2 class="titulo2 text-slate-800">Test completed!</h2>
            <p id="score-text-container" class="text-xl font-bold text-slate-600">Correct answers: <span id="score-text">0/10</span></p>
            <p id="score-percentage-container" class="text-xl font-bold text-slate-600">Your score is <span id="score-percentage">0%</span></p>
        </div>
    </section>

    <!-- Cuadro independiente para el Ejercicio -->
    <section class="mb-6">
        <div class="text-container">

            <!-- Banco de palabras compacto -->
            <div class="mb-6 p-3 bg-slate-50 border border-slate-200 rounded-xl">
                <p class="text-xs font-bold text-slate-700 mb-2 text-center uppercase tracking-wider">Word Bank</p>
                <div id="word-bank" class="flex flex-wrap gap-2 justify-center min-h-[50px] p-1">
                    <!-- Fichas inyectadas por JS -->
                </div>
            </div>

            <!-- Lista de Oraciones -->
            <div id="sentences-container">
                <!-- Oraciones inyectadas por JS -->
            </div>

            <!-- Botones de Acción -->
            <div class="check-btn-container mt-8 text-center">
                <button type="button" onclick="checkAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200">
                    Check Answers
                </button>
                <button type="button" onclick="resetQuiz()" class="ml-4 bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg shadow transition duration-200">
                    Reset
                </button>
            </div>

        </div>
    </section>

</main>

<script>
const data = [
    {
        id: 1,
        textBefore: "It's important to",
        textAfter: "a good impression during a job interview.",
        answer: "make",
        explanation: "We use 'make' with nouns related to communication, plans, and impressions (make a good impression)."
    },
    {
        id: 2,
        textBefore: "Can you help me",
        textAfter: "the housework this afternoon?",
        answer: "do",
        explanation: "We use 'do' for general activities, work, and chores (do the housework, do your homework)."
    },
    {
        id: 3,
        textBefore: "Let's",
        textAfter: "a break for ten minutes and get some water.",
        answer: "take",
        explanation: "We use 'take' with periods of rest or relaxation (take a break, take a nap)."
    },
    {
        id: 4,
        textBefore: "Please",
        textAfter: "attention to the teacher's instructions.",
        answer: "pay",
        explanation: "To direct your focus is to 'pay attention'."
    },
    {
        id: 5,
        textBefore: "It was nice to",
        textAfter: "a conversation with you.",
        answer: "have",
        explanation: "We use 'have' with discussions, talks, and interactions (have a conversation)."
    },
    {
        id: 6,
        textBefore: "Julia is a writer, she can",
        textAfter: "you advice on how to improve your writing.",
        answer: "give",
        explanation: "We use 'give' when offering recommendations or opinions (give advice)."
    },
    {
        id: 7,
        textBefore: "Using keyboard shortcuts can help you",
        textAfter: "time.",
        answer: "save",
        explanation: "We use 'save' when avoiding the waste of time, money, or effort (save time)."
    },
    {
        id: 8,
        textBefore: "Let's",
        textAfter: "in touch after the course finishes.",
        answer: "keep",
        explanation: "To stay communicated over time is to 'keep in touch'."
    },
    {
        id: 9,
        textBefore: "Try not to",
        textAfter: "patience when solving difficult exercises.",
        answer: "lose",
        explanation: "We use 'lose' with control, temper, or patience (lose patience, lose control)."
    },
    {
        id: 10,
        textBefore: "You should wear a jacket so you don't",
        textAfter: "a cold.",
        answer: "catch",
        explanation: "We use 'catch' when referring to an illness (catch a cold)."
    }
];

const distractors = [
    { id: 11, text: "bring" },
    { id: 12, text: "get" },
    { id: 13, text: "put" },
    { id: 14, text: "run" },
    { id: 15, text: "find" }
];
</script>
<script src="../assets/js/drag-and-drop.js"></script>
</body>
</html>
