<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasado simple - 2</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="../assets/css/style-ejercicios.css">
</head>
<body>

<header class="max-w-4xl mx-auto text-center">
    <img src="../assets/img/logo.png" class="imagen1" alt="Logo de Inglés Superior" style="display: block; margin: 1rem auto;">
    <p class="formula mx-auto p-0" style="width: 30%">MÓDULO: 4</p>
    <h1 class="titulo1 mt-2 mb-8">Pasado simple</h1>
</header>

<main class="max-w-4xl mx-auto">

    <section class="mb-6">
        <div class="text-container">
            <h2 class="titulo2 mb-4">Drag and drop</h2>
            <p class="text-slate-600">Drag the correct words from the word bank and drop them to complete each sentence.</p>
        </div>
    </section>

    <section id="results-section" class="hidden my-12">
        <div id="results-card" class="text-container text-center border-0 shadow-lg bg-white space-y-3">
            <div id="score-emoji" class="text-4xl">🚀</div>
            <h2 class="titulo2 text-slate-800">Test completed!</h2>
            <p id="score-text-container" class="text-xl font-bold text-slate-600">Correct answers: <span id="score-text">0/10</span></p>
            <p id="score-percentage-container" class="text-xl font-bold text-slate-600">Your score is <span id="score-percentage">0%</span></p>
        </div>
    </section>

    <section class="mb-6">
        <div class="text-container">
            <div class="mb-6 p-3 bg-slate-50 border border-slate-200 rounded-xl">
                <p class="text-xs font-bold text-slate-700 mb-2 text-center uppercase tracking-wider">Word Bank</p>
                <div id="word-bank" class="flex flex-wrap gap-2 justify-center min-h-[50px] p-1">
                </div>
            </div>

            <div id="sentences-container">
            </div>

            <div class="check-btn-container mt-8 text-center">
                <button type="button" onclick="checkAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200">
                    Check Answers
                </button>
                <button type="button" onclick="resetQuiz()" class="ml-4 bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg shadow transition duration-200">
                    Reset
                </button>
            </div>
        </div>
    </section>
</main>

<script>
const data = [
  {
    id: 1,
    textBefore: "She ",
    textAfter: "to the supermarket yesterday.",
    answer: "went",
    explanation: "'Went' is the simple past form of 'go'."
  },
  {
    id: 2,
    textBefore: "They ",
    textAfter: "soccer last weekend.",
    answer: "played",
    explanation: "'Played' is the simple past form of 'play'."
  },
  {
    id: 3,
    textBefore: "He ",
    textAfter: "eat breakfast this morning.",
    answer: "didn't",
    explanation: "Use 'didn't' (did not) for negative sentences in simple past."
  },
  {
    id: 4,
    textBefore: "",
    textAfter: "you see that movie last night?",
    answer: "Did",
    explanation: "Questions in simple past start with the auxiliary verb 'did'."
  },
  {
    id: 5,
    textBefore: "We ",
    textAfter: "our grandparents last month.",
    answer: "visited",
    explanation: "'Visited' is the simple past form of 'visit'."
  },
  {
    id: 6,
    textBefore: "I ",
    textAfter: "a new car two days ago.",
    answer: "bought",
    explanation: "'Bought' is the simple past form of 'buy'."
  },
  {
    id: 7,
    textBefore: "María ",
    textAfter: "hard for her English exam.",
    answer: "studied",
    explanation: "Verbs ending in consonant + y change to -ied in past tense (study -> studied)."
  },
  {
    id: 8,
    textBefore: "The children ",
    textAfter: "a funny cartoon.",
    answer: "watched",
    explanation: "'Watched' is the simple past form of 'watch' (viewing something)."
  },
  {
    id: 9,
    textBefore: "My father ",
    textAfter: "dinner for everyone.",
    answer: "cooked",
    explanation: "'Cooked' is the simple past form of 'cook' (preparing meals)."
  },
  {
    id: 10,
    textBefore: "",
    textAfter: "she tired after the long trip?",
    answer: "Was",
    explanation: "In simple past, use 'was' for third person singular ('she')."
  }
];

const distractors = [
    { id: 11, text: "goes" },
    { id: 12, text: "plaid" },
    { id: 13, text: "don't" },
    { id: 14, text: "Does" },
    { id: 15, text: "buyed" }
];
</script>
<script src="../assets/js/drag-and-drop.js"></script>
</body>
</html>
