<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas wh- en pasado - 1b</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="../assets/css/style-ejercicios.css">
</head>
<body>
<header class="max-w-4xl mx-auto text-center">
    <img src="../assets/img/logo.png" class="imagen1" alt="Logo de Inglés Superior" style="display: block; margin: 1rem auto;">
    <p class="formula mx-auto p-0" style="width: 30%">MÓDULO: 4</p>
    <h1 class="titulo1 mt-2 mb-8">Preguntas wh- en pasado</h1>
</header>
<main class="max-w-4xl mx-auto">
    <section class="mb-6">
        <div class="text-container">
            <h2 class="titulo2 mb-4">Choose the correct option</h2>
            <p class="text-slate-600">Select the correct option to complete each sentence.</p>
        </div>
    </section>
    <section id="results-section" class="hidden my-12">
        <div id="results-card" class="text-container text-center border-0 shadow-lg bg-white space-y-3">
            <div id="score-emoji" class="text-4xl">🚀</div>
            <h2 class="titulo2 text-slate-800">Test completed!</h2>
            <p id="score-text-container" class="text-xl font-bold text-slate-800">Correct answers: <span id="score-text">0/10</span></p>
            <p id="score-percentage-container" class="text-xl font-bold text-slate-800">Your score is <span id="score-percentage">0%</span></p>
        </div>
    </section>
    <section class="mb-6">
        <div class="text-container">
            <form id="quiz-form">
                <div id="questions-container"></div>
                <div class="check-btn-container mt-10 text-center">
                    <button type="button" onclick="checkAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200">Check Answers</button>
                    <button type="button" onclick="resetQuiz()" class="ml-4 bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg shadow transition duration-200">Reset</button>
                </div>
            </form>
        </div>
    </section>
</main>
<script>
const data = [
    {
        textBefore: "Which book ",
        textAfter: " you choose to read?",
        options: ["do", "were", "did"],
        correct: "did",
        explanation: "We use 'did' for all subjects in past simple Wh- questions when there is a main verb."
    },
    {
        textBefore: "",
        textAfter: " did he buy at the store? He bought a new shirt.",
        options: ["What", "Where", "Who"],
        correct: "What",
        explanation: "The answer mentions an object ('a new shirt'), so we ask with 'What'."
    },
    {
        textBefore: "Who ",
        textAfter: " your teacher in 2010?",
        options: ["did", "was", "were"],
        correct: "was",
        explanation: "Since 'your teacher' is singular (he/she), use 'was' for the past of 'to be'."
    },
    {
        textBefore: "",
        textAfter: " were you last night? I was at the gym.",
        options: ["Where", "Who", "What"],
        correct: "Where",
        explanation: "The answer points to a location, so we use 'Where'."
    },
    {
        textBefore: "Why ",
        textAfter: " he leave the office so early?",
        options: ["were", "was", "did"],
        correct: "did",
        explanation: "We use 'did' for all subjects in past simple Wh- questions when there is a main verb."
    },
    {
        textBefore: "",
        textAfter: " did your sister do yesterday? She studied for her exam.",
        options: ["Why", "What", "When"],
        correct: "What",
        explanation: "We are asking about the activity or action done, using 'What'."
    },
    {
        textBefore: "What ",
        textAfter: " the weather like on your trip?",
        options: ["did", "was", "were"],
        correct: "was",
        explanation: "'Weather' is an 'it', so we use 'was'."
    },
    {
        textBefore: "What time ",
        textAfter: " you arrive at the airport?",
        options: ["did", "were", "do"],
        correct: "did",
        explanation: "Use 'did' to ask about specific past actions like arriving."
    },
    {
        textBefore: "",
        textAfter: " did the meeting end? It ended at 5:00 PM.",
        options: ["What time", "Who", "Where"],
        correct: "What time",
        explanation: "When referring to an exact hour, 'What time' is the proper choice."
    },
    {
        textBefore: "",
        textAfter: " was the project finished? Last Friday.",
        options: ["What", "How", "When"],
        correct: "When",
        explanation: "The answer is a point in time, so we use 'When'."
    }
];
</script>
<script src="../assets/js/multiple-choice.js"></script>
</body>
</html>
