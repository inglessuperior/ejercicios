<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presente simple - 1</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="../assets/css/style-ejercicios.css">
</head>
<body>
<header class="max-w-4xl mx-auto text-center">

<img src="../assets/img/logo.png" class="imagen1" alt="Logo de Inglés Superior" style="display: block; margin: 1rem auto;">

    <p class="formula mx-auto p-0" style="width: 30%">MÓDULO: 2</p>
    <h1 class="titulo1 mt-2 mb-8">Presente simple</h1>
</header>
<main class="max-w-4xl mx-auto">
    <section class="mb-6">
        <div class="text-container">
            <h2 class="titulo2 mb-4">Choose the correct option</h2>
            <p class="text-slate-600">Select the correct option to complete each sentence.</p>
        </div>
    </section>
    <section id="results-section" class="hidden my-12">
        <div id="results-card" class="text-container text-center border-0 shadow-lg bg-white space-y-3">
            <div id="score-emoji" class="text-4xl">🚀</div>
            <h2 class="titulo2 text-slate-800">Test completed!</h2>
            <p id="score-text-container" class="text-xl font-bold text-slate-800">Correct answers: <span id="score-text">0/10</span></p>
            <p id="score-percentage-container" class="text-xl font-bold text-slate-800">Your score is <span id="score-percentage">0%</span></p>
        </div>
    </section>
    <section class="mb-6">
        <div class="text-container">
            <form id="quiz-form">
                <div id="questions-container"></div>
                <div class="check-btn-container mt-10 text-center">
                    <button type="button" onclick="checkAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow transition duration-200">Check Answers</button>
                    <button type="button" onclick="resetQuiz()" class="ml-4 bg-slate-500 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg shadow transition duration-200">Reset</button>
                </div>
            </form>
        </div>
    </section>
</main>
<script>
const data = [
    {
        textBefore: "She ",
        textAfter: " in a hospital on weekends.",
        options: ["work", "works", "working"],
        correct: "works",
        explanation: "In positive sentences with 'he', 'she', or 'it', we add -s the base verb (she works)."
    },
    {
        textBefore: "They ",
        textAfter: " like coffee in the morning.",
        options: ["don't", "doesn't", "not"],
        correct: "don't",
        explanation: "We use 'don't' (do not) for negative sentences with 'I', 'you', 'we', and 'they'."
    },
    {
        textBefore: "",
        textAfter: " your brother live in London?",
        options: ["Do", "Is", "Does"],
        correct: "Does",
        explanation: "We use 'does' to start questions with third person singular subjects ('your brother' = 'he')."
    },
    {
        textBefore: "My English teacher ",
        textAfter: " grammar very clearly.",
        options: ["teach", "teaches", "teachies"],
        correct: "teaches",
        explanation: "Verbs ending in -ch add -es in the third person singular (teach → teaches)."
    },
    {
        textBefore: "He doesn't ",
        textAfter: " French very well.",
        options: ["speak", "speaks", "speaking"],
        correct: "speak",
        explanation: "After 'doesn't', we use the verb in its base form (he doesn't speak)."
    },
    {
        textBefore: "Where ",
        textAfter: " you usually buy your groceries?",
        options: ["does", "do", "are"],
        correct: "do",
        explanation: "Questions with 'you' use the auxiliary verb 'do' (Where do you...?)."
    },
    {
        textBefore: "Alex ",
        textAfter: " every night before going to sleep.",
        options: ["study", "studys", "studies"],
        correct: "studies",
        explanation: "Verbs ending in a consonant + -y change the -y to -ies for 'he/she/it' (study → studies)."
    },
    {
        textBefore: "It ",
        textAfter: " very often in the summer.",
        options: ["don't rain", "doesn't rains", "doesn't rain"],
        correct: "doesn't rain",
        explanation: "Use 'doesn't' for 'it', followed by the base verb 'rain'."
    },
    {
        textBefore: "What time does the movie ",
        textAfter: " tonight?",
        options: ["start", "starts", "starting"],
        correct: "start",
        explanation: "In questions with 'do/does', the main verb must always be in base form (Does the movie start...?)."
    },
    {
        textBefore: "My parents ",
        textAfter: " tennis every Sunday afternoon.",
        options: ["plays", "play", "playing"],
        correct: "play",
        explanation: "For plural subjects like 'my parents' ('they'), use the base verb without adding -s."
    }
];
</script>
<script src="../assets/js/multiple-choice.js"></script>
</body>
</html>
